## This value is automatically replaced by the version specified in gradle.properties.
## Do not change this.
version: ${version}

## This is the minimum minecraft version required to run your plugin.
api-version: 1.14

## This is required and marks Slimefun as a plugin dependency.
depend: [Slimefun, ExoticGarden]