# Gradle Version Catalog
# 依赖集中管理：build.gradle.kts 里用 `libs.xxx` 引用。

[versions]
# Core
# 原 pom 为 1.17.1-R0.1-SNAPSHOT，保持不变
spigot-api = "1.17.1-R0.1-SNAPSHOT"
# 原 pom 为 2024.3，2026-11-07 主人确认升级
slimefun4 = "2025.1"
# 原 pom 为 RELEASE（浮动版本），固定为具体版本
jetbrains-annotations = "26.0.2"

[libraries]
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot-api" }
slimefun4 = { module = "com.github.SlimefunGuguProject:Slimefun4", version.ref = "slimefun4" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
